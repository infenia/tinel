[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tinel"
version = "0.1.0"
description = "Next-generation open-source platform designed to control, optimize, and analyze Linux-based systems using AI and LLMs"
authors = [{ name = "Infenia Private Limited", email = "arun@infenia.com" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.11,<4.0"
keywords = [
    "ai",
    "llm",
    "linux",
    "hardware",
    "system",
    "kernel",
    "model-context-protocol",
    "ai-tooling",
    "devops",
    "cloud-native",
    "open-source",
    "tuning",
    "diagnostics",
    "optimization",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Hardware :: Hardware Drivers",
    "Topic :: System :: Hardware",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "mcp>=1.0.0",
    "psutil>=5.9.0",
    "cryptography>=41.0.0",
    "pyyaml>=6.0.2",
    "nox>=2025.5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.0.287",
    "mypy>=1.5.1",
    "types-PyYAML>=6.0.12.20250516",
    "build>=1.0.0",
    "nox>=2023.4.22",
    "coverage[toml]>=7.3.0",
]
docs = ["pdoc>=14.0.0"]


[project.urls]
Homepage = "https://github.com/infenia/tinel"
Repository = "https://github.com/infenia/tinel"
Documentation = "https://github.com/infenia/tinel#readme"
Issues = "https://github.com/infenia/tinel/issues"
Changelog = "https://github.com/infenia/tinel/blob/main/CHANGELOG.md"

[project.scripts]
tinel = "tinel.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["tinel"]

[tool.hatch.build.targets.sdist]
include = [
    "tinel",
    "tests",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
path = "tinel/__init__.py"


[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [".git", ".ruff_cache", ".nox", ".venv", "__pypackages__", "dist", "build"]

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
select = ["E", "F", "I", "N", "W", "B", "C4", "SIM", "ERA", "PL"]
ignore = []
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.isort]
known-first-party = ["tinel"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Configure docstring formatting to be compatible with Black
docstring-code-format = true
docstring-code-line-length = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
# Pytest configuration for Tinel project
# Test discovery
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"

# Output and reporting
addopts = [
    "--verbose",
    "--tb=short",
    "--strict-markers",
    "--strict-config",
    "--cov=tinel",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=85",
    "--durations=10",
]

# Test markers
markers = [
    "unit: Unit tests - fast, isolated tests of individual components",
    "integration: Integration tests - test component interactions",
    "performance: Performance tests - verify performance characteristics",
    "security: Security tests - verify security measures",
    "slow: Slow tests that may take longer to run",
    "network: Tests that require network access",
    "sudo: Tests that require sudo privileges",
    "system: Tests that interact with the actual system (not mocked)",
]

# Minimum version requirements
minversion = "6.0"

# Test session configuration
console_output_style = "progress"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

# Warnings configuration
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning:distutils.*",
    "ignore::PendingDeprecationWarning",
    "ignore:.*imp module.*:DeprecationWarning",
]

[tool.coverage.run]
source = ["tinel"]
branch = true
parallel = true
concurrency = ["multiprocessing"]
data_file = ".coverage"
omit = [
    "tinel/__main__.py", "tests/*",
    "*/test_*",
    "setup.py",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "pragma: no branch",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "except ImportError:",
    "if TYPE_CHECKING:",
    "except ImportError:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
exclude_also = [
    "pragma: no branch",
]
precision = 2
show_missing = true
skip_covered = false
sort = "Cover"


[tool.coverage.html]
directory = "htmlcov"
title = "Tinel Coverage Report"


[tool.coverage.xml]
output = "coverage.xml"

[tool.pdoc]
modules = ["tinel"]
output_directory = "docs"

[dependency-groups]
dev = [
    "ruff>=0.12.5",
]
